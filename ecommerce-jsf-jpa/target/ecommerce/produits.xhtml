<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/template.xhtml">

    <ui:define name="titre">Catalogue</ui:define>

    <ui:define name="contenu">
        <h1>Gestion du catalogue</h1>
        <p class="aide">Page d'administration simplifiée (sans contrôle d'accès, pour les besoins de l'atelier).</p>

        <h:form styleClass="formulaire large">
            <h2>Ajouter un produit</h2>

            <h:outputLabel for="nom" value="Nom"/>
            <h:inputText id="nom" value="#{produitBean.produit.nom}" required="true"
                         requiredMessage="Le nom est obligatoire."/>
            <h:message for="nom" styleClass="msg-erreur"/>

            <h:outputLabel for="description" value="Description"/>
            <h:inputText id="description" value="#{produitBean.produit.description}"/>

            <h:outputLabel for="prix" value="Prix (MAD)"/>
            <h:inputText id="prix" value="#{produitBean.produit.prix}" required="true"
                         requiredMessage="Le prix est obligatoire."
                         converterMessage="Prix invalide (ex : 199.90)."/>
            <h:message for="prix" styleClass="msg-erreur"/>

            <h:outputLabel for="stock" value="Stock"/>
            <h:inputText id="stock" value="#{produitBean.produit.stock}" required="true"
                         requiredMessage="Le stock est obligatoire."
                         converterMessage="Stock invalide.">
                <f:validateLongRange minimum="0"/>
            </h:inputText>
            <h:message for="stock" styleClass="msg-erreur"/>

            <h:outputLabel for="categorie" value="Catégorie"/>
            <h:selectOneMenu id="categorie" value="#{produitBean.categorieId}">
                <f:selectItem itemLabel="-- Choisir --" itemValue="" noSelectionOption="true"/>
                <f:selectItems value="#{produitBean.categories}" var="c" itemValue="#{c.id}" itemLabel="#{c.nom}"/>
            </h:selectOneMenu>

            <h:commandButton value="Ajouter à la vitrine" action="#{produitBean.enregistrer}" styleClass="bouton plein"/>
        </h:form>

        <h:form>
            <h2>Produits (#{produitBean.produits.size()})</h2>
            <h:dataTable value="#{produitBean.produits}" var="p" styleClass="tableau"
                         headerClass="entete" rowClasses="ligne-paire,ligne-impaire">
                <h:column><f:facet name="header">#</f:facet>#{p.id}</h:column>
                <h:column><f:facet name="header">Nom</f:facet>#{p.nom}</h:column>
                <h:column><f:facet name="header">Catégorie</f:facet>#{p.categorie.nom}</h:column>
                <h:column>
                    <f:facet name="header">Prix</f:facet>
                    <h:outputText value="#{p.prix}"><f:convertNumber pattern="#,##0.00"/></h:outputText> MAD
                </h:column>
                <h:column><f:facet name="header">Stock</f:facet>#{p.stock}</h:column>
                <h:column>
                    <h:commandButton value="Supprimer" styleClass="bouton petit danger"
                                     action="#{produitBean.supprimer(p.id)}"
                                     onclick="return confirm('Supprimer ce produit ?');"/>
                </h:column>
            </h:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
