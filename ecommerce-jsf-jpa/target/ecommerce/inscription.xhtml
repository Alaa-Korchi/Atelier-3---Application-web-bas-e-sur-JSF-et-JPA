<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/template.xhtml">

    <ui:define name="titre">Inscription</ui:define>

    <ui:define name="contenu">
        <h1>Créer un compte</h1>
        <h:form styleClass="formulaire">
            <h:outputLabel for="nom" value="Nom"/>
            <h:inputText id="nom" value="#{internauteBean.nom}" required="true"
                         requiredMessage="Le nom est obligatoire."/>
            <h:message for="nom" styleClass="msg-erreur"/>

            <h:outputLabel for="prenom" value="Prénom"/>
            <h:inputText id="prenom" value="#{internauteBean.prenom}" required="true"
                         requiredMessage="Le prénom est obligatoire."/>
            <h:message for="prenom" styleClass="msg-erreur"/>

            <h:outputLabel for="email" value="Email"/>
            <h:inputText id="email" value="#{internauteBean.email}" required="true"
                         requiredMessage="L'email est obligatoire.">
                <f:validateRegex pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$"/>
            </h:inputText>
            <h:message for="email" styleClass="msg-erreur"/>

            <h:outputLabel for="mdp" value="Mot de passe (6 caractères min.)"/>
            <h:inputSecret id="mdp" value="#{internauteBean.motDePasse}" required="true"
                           requiredMessage="Le mot de passe est obligatoire.">
                <f:validateLength minimum="6"/>
            </h:inputSecret>
            <h:message for="mdp" styleClass="msg-erreur"/>

            <h:outputLabel for="confirmation" value="Confirmer le mot de passe"/>
            <h:inputSecret id="confirmation" value="#{internauteBean.confirmation}" required="true"
                           requiredMessage="Veuillez confirmer le mot de passe."/>
            <h:message for="confirmation" styleClass="msg-erreur"/>

            <h:commandButton value="S'inscrire" action="#{internauteBean.inscrire}" styleClass="bouton plein"/>
            <p class="aide">Déjà inscrit ? <h:link outcome="login" value="Connectez-vous"/></p>
        </h:form>
    </ui:define>
</ui:composition>
