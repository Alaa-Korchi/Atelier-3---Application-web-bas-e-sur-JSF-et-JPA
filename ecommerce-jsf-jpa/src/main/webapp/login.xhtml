<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/template.xhtml">

    <ui:define name="titre">Connexion</ui:define>

    <ui:define name="contenu">
        <h1>Connexion</h1>
        <h:form styleClass="formulaire">
            <h:outputLabel for="email" value="Email"/>
            <h:inputText id="email" value="#{internauteBean.email}" required="true"
                         requiredMessage="L'email est obligatoire."/>
            <h:message for="email" styleClass="msg-erreur"/>

            <h:outputLabel for="mdp" value="Mot de passe"/>
            <h:inputSecret id="mdp" value="#{internauteBean.motDePasse}" required="true"
                           requiredMessage="Le mot de passe est obligatoire."/>
            <h:message for="mdp" styleClass="msg-erreur"/>

            <h:commandButton value="Se connecter" action="#{internauteBean.connecter}" styleClass="bouton plein"/>
            <p class="aide">Pas encore de compte ? <h:link outcome="inscription" value="Inscrivez-vous"/></p>
        </h:form>
    </ui:define>
</ui:composition>
